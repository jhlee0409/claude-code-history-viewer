# Serena project configuration (schema: Serena 1.7).
# Machine-specific overrides belong in .serena/project.local.yml (gitignored via .serena/.gitignore).

# the name by which the project can be referenced within Serena/when chatting with the LLM.
project_name: "claude-code-history-viewer"

# Language servers to start (LSP backend). The first entry is the default/fallback server.
# typescript serves .ts/.tsx/.js/.jsx/.mjs/.cjs (src/, scripts/, vite.config.ts);
# rust serves .rs (src-tauri/). rust-analyzer discovers src-tauri/Cargo.toml on its own
# (no root Cargo.toml; it scans immediate child directories of the workspace root).
language_servers: ["typescript", "rust"]

# the encoding used by text files in the project
encoding: "utf-8"

# optional shell command run before the language backend is initialised (trusted projects only).
activation_command:

# maximum time in seconds to wait for activation_command.
activation_command_timeout: 180

# line ending convention for source files written by Serena: unset (global setting), "lf", "crlf" or "native".
line_ending:

# language backend (LSP or JetBrains); unset = global setting from serena_config.yml.
language_backend:

# whether to use the project's .gitignore files to ignore files
ignore_all_files_in_gitignore: true

# language-server-specific options (only applied for trusted projects).
ls_specific_settings: {}

# workspace folders indexed by Serena and sent to every language server.
# Keep "." : the list is shared by ALL language servers, so narrowing it to src-tauri would drop src/.
ls_workspace_folders: ["."]

# additional (non-indexed) workspace folders for cross-package references.
ls_additional_workspace_folders: []

# additional paths to ignore (gitignore syntax), on top of every .gitignore in the repo.
# types.generated.ts is generated by scripts/generate-i18n-types.mjs ("do not edit"):
# keep it out of Serena's symbol index and out of reach of Serena's editing tools.
ignored_paths:
  - "src/i18n/types.generated.ts"

# whether the project is in read-only mode
read_only: false

# list of tool names to exclude (extends global exclusions).
excluded_tools: []

# optional tools to include (extends global inclusions).
included_optional_tools: []

# fixed base tool set (empty = Serena's default set).
fixed_tools: []

# modes activated by default; unset = default_modes from the global serena_config.yml.
default_modes:

# modes activated additionally for this project.
added_modes:

# initial prompt given to the LLM upon activating the project
initial_prompt: ""

# time budget (seconds) per tool call for additional symbol information; unset = global setting.
symbol_info_budget:

# regex patterns (full match on the memory name) marking memories read-only.
read_only_memory_patterns: []

# regex patterns (full match on the memory name) for memories to ignore completely.
ignored_memory_patterns: []
