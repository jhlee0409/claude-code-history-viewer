name: Frontend Tests

# Gates the React/TypeScript frontend on every PR/push that touches it.
# `rust-tests.yml` only covers `src-tauri/**` (cargo fmt/clippy/test), and
# `update-flow-tests.yml` runs vitest for just the 4 update-flow files, so the
# rest of the ~860 frontend tests (plus tsc/eslint/i18n) were previously
# ungated — a broad frontend regression could land on develop unnoticed.
# The bundle step catches build-only failures (rollup/vite config, worker
# bundling, assets) that tsc/vitest never exercise and that otherwise surface
# only when the release workflow runs `tauri build` after a tag push. It runs
# on Linux, so platform-specific bundling issues (like #579's macOS x86_64
# worker failure) can still slip through.
on:
  push:
    branches: [main, develop]
    paths: &frontend_paths
      - "src/**"
      - "scripts/**"
      - "index.html"
      - "vite.config.ts"
      - "public/**"
      - "postcss.config.js"
      - "tsconfig*.json"
      - "eslint.config.js"
      - "package.json"
      - "pnpm-lock.yaml"
      # ui-harness: the WebUI server and providers are part of every capture.
      - "src-tauri/**"
      - ".nvmrc"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    branches: [main, develop]
    paths: *frontend_paths

  workflow_dispatch:
    inputs:
      full_matrix:
        description: "ui-harness: capture the full scenario matrix instead of the CI subset (scripts/ui-capture/ci-scenarios.mjs)"
        type: boolean
        default: false
      base_ref:
        description: "ui-harness: git ref the capture gate compares against"
        type: string
        default: origin/develop

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        # No `version:` — `packageManager` in package.json is the source of truth
        # (pinning here has historically conflicted with it).
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc)
        run: pnpm tsc --build .

      - name: Lint (eslint)
        run: pnpm lint

      - name: Unit tests (vitest)
        run: pnpm -s vitest run

      - name: i18n key validation
        run: pnpm run i18n:validate

      - name: Bundle (vite build)
        run: pnpm exec vite build

  # Real-browser checks of the WebUI build (plan I0, RR C7). The harness
  # integration tests need WebKit AND the harness server binary
  # (.ui-capture/build/cchv-server), which only build.sh makes, so the order
  # on a clean runner is: install -> Rust + system packages -> browsers with
  # their OS deps -> build.sh -> tests with CI_REQUIRE_BROWSER=1 (a missing
  # browser or server fails instead of skipping) -> ui:states -> the
  # unchanged gate against the PR's base. PRs and pushes gate the 32 exact
  # ids of scripts/ui-capture/ci-scenarios.mjs (64 captures, head + base);
  # the full matrix (~259 pairs, ~30 min of capture on a fast Mac) runs only
  # on a manual dispatch with full_matrix, or locally with `pnpm ui:capture`.
  ui-harness:
    name: UI harness (WebKit + Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full_matrix && 120 || 30 }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --base <sha> checks the base out into a worktree

      # 1. pnpm, Node from .nvmrc, dependencies
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 2. Rust stable + the same Linux packages as rust-tests.yml
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # 3. Browsers and their runtime dependencies
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps webkit chromium

      # 4. The bundle + server the integration tests and run.mjs use
      - name: Build the WebUI bundle and harness server
        run: bash scripts/ui-capture/build.sh . .ui-capture/build/dist .ui-capture/build/cchv-server

      # 5. Browser tests (skipped = failure), states gallery, unchanged gate
      - name: Harness tests (no skips)
        env:
          CI_REQUIRE_BROWSER: "1"
        run: pnpm exec vitest run scripts/ui-capture --maxWorkers=2 --testTimeout=60000

      - name: Primitive states gallery
        run: pnpm ui:states

      # --no-build reuses the head build of step 4 only; the base has no
      # artifacts on a clean runner, so run.mjs builds it into
      # .ui-capture/build-base/<sha> (sharing src-tauri/target).
      # Exact ids (not --only's substring match); test/ciScenarios.test.mjs
      # pins the set.
      - name: Capture gate (unchanged vs. base, CI subset)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000') || (github.event_name == 'workflow_dispatch' && !inputs.full_matrix)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base_ref || github.event.before }}
        run: pnpm ui:capture --no-build --base "$BASE_SHA" --gate unchanged --scenarios scripts/ui-capture/ci-scenarios.mjs

      - name: Capture gate (unchanged vs. base, full matrix)
        if: github.event_name == 'workflow_dispatch' && inputs.full_matrix
        env:
          BASE_SHA: ${{ inputs.base_ref }}
        run: pnpm ui:capture --no-build --base "$BASE_SHA" --gate unchanged

      - name: Upload harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-harness-${{ github.sha }}
          # Every path is under .ui-capture/, a hidden directory, which v4
          # leaves out unless asked; the list stays limited to the evidence.
          include-hidden-files: true
          path: |
            .ui-capture/runs/latest/compare/
            .ui-capture/runs/latest/manifest.json
            .ui-capture/runs/latest/probes.json
            .ui-capture/states/latest/summary.json
          if-no-files-found: ignore
