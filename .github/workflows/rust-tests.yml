name: Rust Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-tests.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-tests.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  # Quick format and lint check (runs in parallel with test)
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true


      - name: Create dist placeholder for rust-embed
        run: mkdir -p dist && touch dist/index.html

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # Both feature sets. `--all-features` alone missed an
      # `items_after_test_module` error that only the default set reported,
      # because the feature-gated items around it change what follows the test
      # module. Reported by @nightcityblade on #546.
      - name: Run Clippy (default features)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Clippy (all features)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Main test job - runs in parallel with lint
  # PR: Ubuntu only, Main: Ubuntu + macOS
  #
  # Windows is NOT here. It gets its own job below, because the Windows suite
  # does not pass yet (#540, #541) and putting it in this matrix would make
  # every PR red for reasons unrelated to the PR.
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # `shell: bash` because the Windows runner defaults to PowerShell, which
      # has no `touch` and rejects `mkdir -p`. Git Bash ships on the image.
      - name: Create dist placeholder for rust-embed
        shell: bash
        run: mkdir -p dist && touch dist/index.html

      - name: Run tests with nextest
        working-directory: src-tauri
        run: cargo nextest run --profile ci --retries 2

      # webui-server gates extra command surface (incl. is_safe_session_path),
      # which the default run does not compile. Exercise it explicitly so those
      # paths get real test coverage (e.g. the #355 symlinked-root regression).
      - name: Run tests with nextest (webui-server feature)
        working-directory: src-tauri
        run: cargo nextest run --profile ci --retries 2 --features webui-server

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: src-tauri/target/nextest/ci/junit.xml
          retention-days: 7

  # Windows.
  #
  # Kept as its own job rather than folded into the matrix above only because
  # it needs the `shell: bash` dist placeholder below; it runs on every PR and
  # every push, same as Ubuntu.
  #
  # This was informational for a while. When the platform entered CI in #539 it
  # reported 41 failures - the lib test binary had stopped compiling on Windows
  # entirely (#536), so nothing had run there for long enough to accumulate
  # that. Blocking on it then would have reddened every unrelated PR.
  #
  # It is 1010/1010 now (#540, #541, #548, #551), so it gates. The build step
  # stays separate: it is cheap and it is the specific failure that made the
  # platform go dark unnoticed, so it should fail on its own terms rather than
  # inside a test run.
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # `shell: bash` because the runner defaults to PowerShell, which has no
      # `touch` and rejects `mkdir -p`. Git Bash ships on the image.
      - name: Create dist placeholder for rust-embed
        shell: bash
        run: mkdir -p dist && touch dist/index.html

      - name: Build test binaries
        working-directory: src-tauri
        run: |
          cargo nextest run --profile ci --no-run
          cargo nextest run --profile ci --no-run --features webui-server

      # Both feature sets, matching Ubuntu. The default set is not a subset:
      # `grok::get_base_path_returns_none_when_default_dir_absent` only runs
      # there, and it was the one that caught a test skipping itself based on
      # the developer's home (#551).
      - name: Run tests with nextest
        working-directory: src-tauri
        run: cargo nextest run --profile ci --retries 2

      - name: Run tests with nextest (webui-server feature)
        working-directory: src-tauri
        run: cargo nextest run --profile ci --retries 2 --features webui-server

  # Code coverage - main branch only
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true


      - name: Generate coverage report
        working-directory: src-tauri
        run: |
          cargo llvm-cov nextest --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: src-tauri/lcov.info
          flags: rust
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: src-tauri/lcov.info
          retention-days: 7

  # Benchmark tests - main branch only
  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true


      - name: Run benchmarks
        working-directory: src-tauri
        run: cargo bench --no-run

      - name: Store benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: src-tauri/target/criterion
          retention-days: 30

  # Security audit - main branch only (weekly via schedule recommended)
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        working-directory: src-tauri
        run: cargo audit

  # Documentation check - main branch only
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true


      - name: Check documentation
        working-directory: src-tauri
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --document-private-items
